name: research-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps and pytest
        run: pip install -r requirements.txt pytest
      - name: Claim-capped simulation tests
        run: python -m pytest -q tests/test_simulation_engine.py
